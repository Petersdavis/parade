# Parade — Elasticsearch node configuration
#
# Mounted read-only into the container at
#   /usr/share/elasticsearch/config/elasticsearch.yml
#
# Most security settings are supplied via environment variables in
# docker-compose.yml. This file pins the network + discovery behaviour and
# keeps the node bound to the container network only.

cluster.name: parade-es
node.name: parade-es-node-1

# Single-node cluster: no master election, no cross-node discovery.
discovery.type: single-node

# Bind inside the container. The host publishes the port on the public
# interface (see docker-compose.yml). Public exposure is gated by TLS +
# password auth AND mutual TLS (client certificates), so an unauthenticated
# client cannot even complete the TLS handshake.
network.host: 0.0.0.0
http.port: 9200

# --- Security (TLS + auth + mTLS) ---
# Enabled explicitly here as well so the intent is visible in version control.
xpack.security.enabled: true
xpack.security.http.ssl.enabled: true
xpack.security.transport.ssl.enabled: true

# Mutual TLS: require every HTTP client to present a certificate signed by our
# CA. This is the primary defence for a publicly exposed port -- a leaked
# password alone is not enough to connect. The CA that validates client certs
# is the same CA that signs the node cert (certs/ca/ca.crt).
xpack.security.http.ssl.client_authentication: required

# --- Resource / performance guardrails for a small VPS ---
# Keep the thread pools modest so a 2 GB box does not thrash.
thread_pool.write.queue_size: 200
indices.memory.index_buffer_size: 20%

# --- Observability ---
# Health endpoint used by the container healthcheck and by Firebase Functions:
#   GET https://<host>:9200/_cluster/health
